# source = ~/.config/material-you/colors.conf
source = ./colors.conf

# BACKGROUND
background {
    monitor =
    # path = screenshot
    path = ~/Pictures/wallpapers/megumin_light.jpeg
    blur_size = 4
    blur_passes = 3 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}


# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor =
    size = 190, 50
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color =  rgba(255, 255, 255, .0)
    font_color = $dark_primary
    fade_on_empty = false
     font_family = SF Pro Display Bold
 placeholder_text = <i><span foreground="##ffffff99"></span></i>
    hide_input = false
    position = 0, -170
    halign = center
    valign = center
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%I")"
    color =  $light_primary
      shadow_passes = 3
    shadow_size = 2
    font_size = 100
    font_family = AlfaSlabOne 
    position = 0, 100
    halign = center
    valign = center
}

# NAME
label {
    monitor =
    text = 
    color = $dark_primary
    outline_thickness = 1
      shadow_passes = 3
    shadow_size = 1
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 20
    font_family = SF Pro Display Bold
    position = 0, -110
    halign = center
    valign = center
}

# Minute-Time
label {
monitor = 
text = cmd[update:1000] echo -e "$(date +"%M")"
color = $dark_primary
font_size = 100
font_family = AlfaSlabOne
shadow_passes = 3
shadow_size = 2
position = 0, -20
halign = center
valign = center
}
